<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
        * {
        box-sizing: border-box;
        }

        .container {
        padding: 16px 0;
        }

        .container label.field-label {
        display: block;
        margin: 14px 0 6px;
        font-weight: bold;
        color: white;
        }

        input[type="text"],
        input[type="password"] {
        display: block;
        width: 100%;
        padding: 12px;
        margin: 0 0 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 16px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
        outline: 2px solid #d97777;
        border-color: transparent;
        }

        button {
        padding: 12px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        }

        .login-btn {
        width: 100%;
        background-color: #333;
        color: white;
        margin-top: 8px;
        }

        .login-btn:hover {
        opacity: 0.85;
        }

        .remember-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        color: white;
        }

        .modal {
        display: none; 
        position: fixed; 
        z-index: 1; 
        left: 0;
        top: 0;
        width: 100%;
        height: 100%; 
        overflow: auto; 
        background-color: rgb(0,0,0); 
        background-color: rgba(0,0,0,0.4); 
        padding-top: 60px;
        }

        .modal-content {
        position: relative;
        background-color: #700000;
        margin: 0 auto;
        border: 1px solid #888;
        width: 100%;
        max-width: 420px;
        padding: 40px 24px 20px;
        border-radius: 10px;
        box-sizing: border-box;
        }

        .modal-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;

        background-color: #818181;
        padding: 16px;
        margin-top: 20px;
        border-radius: 6px;
        }

        .cancelbtn {
        background-color: #4b4e6d;
        color: white;
        padding: 10px 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        }

        .cancelbtn:hover {
        background-color: #3947dd;
        }

        .psw a {
        color: #700000;
        text-decoration: none;
        font-weight: bold;
        }

        .psw a:hover {
        text-decoration: underline;
        }

        .close {
        position: absolute;
        right: 25px;
        top: 0;
        color: #000;
        font-size: 35px;
        font-weight: bold;
        }

        .close:hover,
        .close:focus {
        color: red;
        cursor: pointer;
        }

        a {
        color: black;
        }

        .animate {
        -webkit-animation: animatezoom 0.6s;
        animation: animatezoom 0.6s
        }

        @-webkit-keyframes animatezoom {
        from {-webkit-transform: scale(0)}
        to {-webkit-transform: scale(1)}
        }

        @keyframes animatezoom {
        from {transform: scale(0)}
        to {transform: scale(1)}
        }
  </style>
</head>
<body>

<button onclick="document.getElementById('id01').style.display='block'">Login</button>


<div id="id01" class="modal">
  

  <form class="modal-content animate">

    <div class="container">
        <span
            onclick="document.getElementById('id01').style.display='none'"
            class="close"
            title="Close Modal"
        >&times;</span>

        <label class="field-label" for="uname">Username</label>
        <input
            type="text"
            id="uname"
            name="uname"
            placeholder="Enter username"
            autocomplete="username"
            required
        >

        <label class="field-label" for="psw">Password</label>
        <input
            type="password"
            id="psw"
            name="psw"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >

        <button type="submit" class="login-btn">Login</button>

        <label class="remember-row">
            <input type="checkbox" checked name="remember">
            Remember me
        </label>
    </div>

    <div class="modal-footer">
        <button type="button"
            onclick="document.getElementById('id01').style.display='none'"
            class="cancelbtn">
            Cancel
        </button>

        <button type="button"
            onclick="document.getElementById('id01').style.display='none'"
            class="cancelbtn">
            Forgot <a href="#">password?</a>
        </button>
    </div>
  </form>
</div>
</body>
</html>
