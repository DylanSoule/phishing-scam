<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not a Scam</title>

    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: x-large;
            
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes grad {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }



        .card {
            background-color: gray;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            transition: 0.3s;
            border-radius: 10px;
            max-width: fit-content;
            padding: 5px;

            text-align: center;
            position: center;

        }

        .red {
            color: #700000; 
            
            animation: pulse 2s infinite;
        }

        .italic {
            font-style: italic;
        }

        .emoji {
            font-style: normal;
            display: inline-block; /* Ensures consistent rendering across browsers */
        }


        #company {
            
            background-image: linear-gradient(to right, red , yellow); 
            max-width: fit-content;
            border-radius: 10px;
            padding-left: 1rem;
            padding-right: 1rem;
            background: linear-gradient(270deg, red, orange, yellow, red);
            background-size: 300% 300%;
            animation: grad 8s ease infinite;
            margin: 0 auto;
            font-size: smaller;
            margin-top: 1px;
            
        }

        .lnk {
            font-style: normal;
            color: black;
            text-decoration: none;

        }
        
        b {
            font-weight: 800;
        }

        .underline {
            text-decoration: underline;
        }


        .container {
        padding: 16px 0;
        }

        .container label.field-label {
        display: block;
        margin: 14px 0 6px;
        font-weight: bold;
        color: white;
        }

        input[type="text"],
        input[type="password"] {
        display: block;
        width: 100%;
        padding: 12px;
        margin: 0 0 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 16px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
        outline: 2px solid #d97777;
        border-color: transparent;
        }

        button {
        padding: 12px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        }

        .login-btn {
        width: 100%;
        background-color: #333;
        color: white;
        margin-top: 8px;
        }

        .login-btn:hover {
        opacity: 0.85;
        }

        .remember-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        color: white;
        }

        .modal {
        display: none; 
        position: fixed; 
        z-index: 1; 
        left: 0;
        top: 0;
        width: 100%;
        height: 100%; 
        overflow: auto; 
        background-color: rgb(0,0,0); 
        background-color: rgba(0,0,0,0.4); 
        padding-top: 60px;
        }

        .modal-content {
        position: relative;
        background-color: #700000;
        margin: 0 auto;
        border: 1px solid #888;
        width: 100%;
        max-width: 420px;
        padding: 40px 24px 20px;
        border-radius: 10px;
        box-sizing: border-box;
        }

        .modal-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;

        background-color: #818181;
        padding: 16px;
        margin-top: 20px;
        border-radius: 6px;
        }

        .cancelbtn {
        background-color: #4b4e6d;
        color: white;
        padding: 10px 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        }

        .cancelbtn:hover {
        background-color: #3947dd;
        }

        .psw a {
        color: #700000;
        text-decoration: none;
        font-weight: bold;
        }

        .psw a:hover {
        text-decoration: underline;
        }

        .close {
        position: absolute;
        right: 25px;
        top: 0;
        color: white;
        font-size: 35px;
        font-weight: bold;
        }

        .close:hover,
        .close:focus {
        color: red;
        cursor: pointer;
        }

        a {
        color: black;
        }

        .animate {
        -webkit-animation: animatezoom 0.6s;
        animation: animatezoom 0.6s
        }

        @-webkit-keyframes animatezoom {
        from {-webkit-transform: scale(0)}
        to {-webkit-transform: scale(1)}
        }

        @keyframes animatezoom {
        from {transform: scale(0)}
        to {transform: scale(1)}
        }


        
    </style>
  
</head>
    <body>

        <div class="card">
            <h1 class="red italic">
                <span class="emoji">🚨</span> Do NOT Leave <span class="emoji">🚨</span>
            </h1>
            <h2>Bank Request Failed</h2>
            <p id="company"><a href="https://www.wellsfargo.com">- Fargs Wellgo -</a></p>
            <p>Credit Card Number ending in <b>0-9</b> has been <b><u>compromised</u></b></p>
            <p>Card will be deleted in <b>5</b> minutes</p>
            <p>Click here to uncompromise:</p>
            <button onclick="document.getElementById('id01').style.display='block'">Uncompromise</button>


<div id="id01" class="modal">
  

  <form class="modal-content animate">

    <div class="container">
        <span
            onclick="document.getElementById('id01').style.display='none'"
            class="close"
            title="Close Modal"
        >&times;</span>

        <label class="field-label" for="uname">Username</label>
        <input
            type="text"
            id="uname"
            name="uname"
            placeholder="Enter username"
            autocomplete="username"
            required
        >

        <label class="field-label" for="psw">Password</label>
        <input
            type="password"
            id="psw"
            name="psw"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >

        <button type="submit" class="login-btn">Login</button>

        <label class="remember-row">
            <input type="checkbox" checked name="remember">
            Remember me
        </label>
    </div>

    <div class="modal-footer">
        <button type="button"
            onclick="document.getElementById('id01').style.display='none'"
            class="cancelbtn">
            Cancel
        </button>

        <button type="button"
            onclick="document.getElementById('id01').style.display='none'"
            class="cancelbtn">
            Forgot <a href="#">password?</a>
        </button>
    </div>
  </form>
</div>

        </div>

    </body>
</html>
